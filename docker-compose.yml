services:
  db:
    image: postgres:16-alpine
    container_name: prontovital-db
    restart: always
    environment:
      POSTGRES_DB: prontovital_db
      POSTGRES_USER: prontovital_user
      POSTGRES_PASSWORD: prontovital_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: